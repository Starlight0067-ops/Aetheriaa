# Builds the AETHERIA iOS app in the cloud (GitHub-hosted Mac) and uploads an UNSIGNED .ipa.
# Sign + install it on your iPhone from Windows with Sideloadly and your Apple ID (see documentation/IOS_BUILD.md).
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ["web/**", "documentation/**", "blender/**", "*.md"]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  ios:
    # Godot 4.7's iOS template (libgodot.a) is built with the iOS 26 SDK (Metal 4 symbols such as
    # MTLTensorDomain), so it must be linked with Xcode 26 or newer.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/web/
          sparse-checkout-cone-mode: false

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk '/^Xcode/{split($2,v,"."); print v[1]}')
          if [ "$MAJOR" -lt 26 ]; then echo "::error::Xcode 26+ is required for Godot 4.7 iOS templates (found $MAJOR)"; exit 1; fi

      - name: Cache Godot + export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos-ios

      - name: Install Godot and iOS export template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip && rm godot.zip
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j templates.tpz "templates/ios.zip" "templates/version.txt" -d "$T"
          rm templates.tpz

      - name: Import assets (VRM retarget + post-import run here)
        run: |
          GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --path . --import || true

      - name: Export Xcode project
        run: |
          GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/AETHERIA.ipa
          ls -la build/ios

      - name: Build unsigned app
        run: |
          set -eo pipefail
          cd build/ios
          ls -la
          SCHEME=$(xcodebuild -list -json -project AETHERIA.xcodeproj | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "Using scheme: $SCHEME"
          xcodebuild -project AETHERIA.xcodeproj -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/dd" build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            > xcodebuild.log 2>&1 || { echo "::error::xcodebuild failed"; grep -E "error:|fatal error" xcodebuild.log | head -40; tail -60 xcodebuild.log; exit 1; }
          tail -5 xcodebuild.log
          find dd/Build/Products -maxdepth 2 -name "*.app"

      - name: Package .ipa
        run: |
          set -eo pipefail
          cd build/ios
          APP=$(find dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "App bundle: $APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AETHERIA-unsigned.ipa Payload
          ls -la AETHERIA-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/ios/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: AETHERIA-iOS-unsigned
          path: build/ios/AETHERIA-unsigned.ipa
          retention-days: 14
