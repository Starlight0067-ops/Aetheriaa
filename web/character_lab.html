<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AETHERIA — Character Lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131f; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #f4eedc; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; left: 16px; bottom: 14px; font-size: 13px; opacity: .85; pointer-events: none; text-shadow: 0 1px 2px #000; }
    #bar { position: fixed; left: 16px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 32px); }
    #bar button { background: #1d2335cc; color: #e9fdff; border: 1px solid #3a4868; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    #bar button.on { background: #2b9c9a; border-color: #7ff5ff; }
    body.shot #bar, body.shot #hud { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="bar"></div>
  <div id="hud"></div>
  <script type="module" src="/src/characters/lab.js"></script>
</body>
</html>
